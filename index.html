<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>formulario</title>
  </head>
  <body>
    <div class="main-container">
      <div class="header">
        <h3>Cadastre seu veículo para vender mais rápido!</h3>
        <div class="form-container">
          <div class="form-header">
            <p>Formulário</p>
          </div>
          <div class="form-body">
            <h1 class="form-title">Venda facil seu carro</h1>
            <p>
              Descreva as características e marque os opcionais que ele possui
            </p>
            <form>
              <div class="mb-3">
                <label for="title" class="form-label">
                  Título do anúncio
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  name="title"
                  id="title"
                  class="form-control"
                  placeholder="Um título para anunciar seu carro"
                  minlength="5"
                  maxlength="100"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label"> Marca do veículo </label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Ex: Honda"
                />
              </div>

              <div class="mb-3">
                <label class="form-label"> Descrição </label>

                <textarea
                  class="form-control"
                  rows="4"
                  placeholder="Descreva o veículo"
                ></textarea>
              </div>

              <button type="submit" class="btn btn-dark w-100">
                Enviar anúncio
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
     <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
